name: frontier-readme

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README is generated from frontier-status.json
        run: python3 scripts/render_frontier_readme.py --check
